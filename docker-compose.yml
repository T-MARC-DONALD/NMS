version: '3.8'

services:
  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/venv
    environment:
      - FLASK_ENV=development
      - FLASK_APP=app.py
    command: python app.py
    networks:
      - nms-network

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://backend:5000/api
    command: npm run dev
    depends_on:
      - backend
    networks:
      - nms-network

networks:
  nms-network:
    driver: bridge
